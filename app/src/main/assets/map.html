<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家人位置</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  /* 地图容器：absolute 铺满视口（Android WebView 下 vh 单位可能失效，JS 侧还会显式设高度） */
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #error { display: none; position: absolute; top: 42%; width: 100%; text-align: center; color: #666; font-size: 14px; }
  /* 全景视角操作提示：进入地图显示数秒，告知可点击标记放大 */
  #hint {
    display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 8; padding: 6px 14px; font-size: 12px; color: #fff;
    background: rgba(30,136,229,0.88); border-radius: 14px; white-space: nowrap;
    transition: opacity 0.6s; opacity: 1;
  }
  /* 全景视角按钮：放大单个点后一键恢复两点完整视野 */
  #resetBtn {
    display: none; position: absolute; right: 12px; top: 12px; z-index: 9;
    padding: 6px 12px; font-size: 12px; color: #1E88E5;
    background: rgba(255,255,255,0.95); border: 1px solid #1E88E5; border-radius: 6px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="error">地图加载失败：请检查网络与 AK 配置</div>
<div id="hint">点击蓝点 / 红点可放大查看详细位置</div>
<button id="resetBtn">全景视角</button>
<script>
  var map = null;

  // 标记图标：我的位置蓝色圆点，家人红色圆点（SVG data URI，无外部资源依赖）
  function myIcon() {
    // 蓝色圆点（base64 PNG，WebView 下比 data URI SVG 更可靠）
    return new BMap.Icon(
      "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAHcSURBVEhL5VU9SwNBEE1paWklaQQLf0CwSmmnlaQSG8HCImAjVrFKCiGVpLFSUAiIpBAUBC2EFEIECwOiiEiMaDSJRnMSd0besRuT2XzcWdj44BV3u/Pe7OzsbiDwb8DMQWYOt3BUzvkViChKRGfcAUR0w8wxZh6QcX2BDIkoa8ScBnH21mnysaZajfJEFJIaXcHMs0opB8EQWsi88HCiYHF6q8S5wmfTCKuRWhaQuVLkiqfP33ksWbSEJRPHVayQ9GoiUrMNpiybuZol1IvLBxVTriIzD0ldF9hQTLqrfPHI6r0l0o/YG22yK7Vd6K7guZ1nK9gLx1MPP7shOwu1x9+qo6xAP7wqNcwq2ruKmacwsH9Zt4L8MHPxYQzm2wzwAwPoHBnkh+gobZCSBhEMIAMZ5IfrpzVjEJUGIQyghjLID83BI6KJNgNtUsYgukEGeiFaG1eKxqDUh0EKI0fXjhXshWvZN5N9Xmq7wAlUitxmXtwrWwK9OLnxZDIHwlK7CbPZ1bqimXTJEupEiOP06+zjUtMCEW2bVHpdeKi5KYsWx7vh7W1g5iUiqptg3DNowZXDCidPXt1vnPoW8bhncQP56HSCvj2719wLsPn6HY7p8uGZxNUSlHP/HN99IB7WBQ3q9AAAAABJRU5ErkJggg==",
      new BMap.Size(24, 24),
      { anchor: new BMap.Size(12, 12) }
    );
  }
  function familyIcon() {
    // 红色圆点（base64 PNG）
    return new BMap.Icon(
      "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAHeSURBVEhL5VU9SwNBELW0tLRM6R8QIhYGQbASsUqpYBEQJIKgIEIEIWAhFmJALMRCbdRCG7HRxjSKhUJKbUwCniZeoknQm5F37sZkNh93FjY+eM3NzpvZ2bmZjo5/A2YOMHOohj3yzK9ARFEiuuEGIKJ7Zo4xc6f0awtkSETJqlilwuXrqyody6oNlCKioNRoCmYedxynDGcIvSwu8GNfr0FrKsKVu9tqINxGahlwM1fibyfHnBkaNIQlXzfWcUNStwlLzTroshQPDwyhVsyvxHW5MszcLXVd4EFx6DOd5vRAvyHSjngbFeRIartQXcHPc7OGsxdmx0Z+XkN2FmqPr07BNhz98OPBzRG3qO8qZh6FoXRxbjj54fvZqQ4QqQuADzCgc6STH6KjVICEDBCGARlIJz8s7u/qAFEZIAgDaiid/FD/eEQ0XBdABcnBiG6Qjl6I1sZIUeiS+giQgKWcvDScvbCws62zT0ltF/gDyXGyOJRbXjIEWvFpckJnDoSkdhX6sR3bJmtm2hBqRIjj71fZx6WmASLa06m0GniouS6LEsfe8LYbmHmeiEraGXMGLZhfW2V7a/N7JxTsWnFMO2/iGnLpNIKans1r7gV4fLWHY6p8WJMYLQF59s/xBVDC8691EJ8nAAAAAElFTkSuQmCC",
      new BMap.Size(24, 24),
      { anchor: new BMap.Size(12, 12) }
    );
  }

  var geocoder = null;
  // 逆地理编码结果缓存(uid→详细地址)：信息窗口直接展示
  var addrCache = {};
  // 当前全景视角的点集([{point,title,label}])：点击标记放大后由"全景视角"按钮恢复
  var viewPoints = [];
  // 操作提示定时器：全景视野显示 5 秒后自动淡出
  var hintTimer = null;

  function hideHint() {
    var el = document.getElementById("hint");
    el.style.opacity = "0";
    setTimeout(function () { el.style.display = "none"; }, 600);
  }

  function showHint() {
    if (viewPoints.length === 0) return;
    var el = document.getElementById("hint");
    el.style.display = "block";
    el.style.opacity = "1";
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(hideHint, 5000);
  }

  /**
   * 视野适配：两点(或单点)完整落入可视区且不被底部信息卡遮挡。
   * 不用 setViewport 的 margins 参数(实测该版本传数组参数会内部异常且无效果)，
   * 改为手动扩包围盒：南边界多扩 40% span(信息卡约占屏高 35%)，东西北各扩 8~10%。
   */
  function fitAll() {
    if (viewPoints.length === 0) return;
    var minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
    for (var i = 0; i < viewPoints.length; i++) {
      var p = viewPoints[i].point;
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;
      if (p.lng < minLng) minLng = p.lng;
      if (p.lng > maxLng) maxLng = p.lng;
    }
    var latSpan = Math.max(maxLat - minLat, 0.01);
    var lngSpan = Math.max(maxLng - minLng, 0.01);
    // 实测底部信息卡占地图区高度约 56%(自下而上)，南边界外扩 2.8×span 才能把
    // 最低点抬到卡片上沿之上(约 61%)，北边界留 0.35 避让返回按钮区
    var sw = new BMap.Point(minLng - lngSpan * 0.15, minLat - latSpan * 2.80);
    var ne = new BMap.Point(maxLng + lngSpan * 0.15, maxLat + latSpan * 0.35);
    map.setViewport([sw, ne]);
  }

  /** 创建标记并绑定点击：放大到街道级 + 信息窗口(名称+详细地址) */
  function addMarker(meta, icon) {
    var marker = new BMap.Marker(meta.point, { icon: icon });
    marker.addEventListener("click", function () {
      map.centerAndZoom(meta.point, 17);
      var addr = addrCache[meta.title];
      var html = "<div style=\"font-size:13px;line-height:1.6;max-width:220px\"><b>" +
          meta.label + "</b>" + (addr ? "<br/>" + addr : "") + "</div>";
      var win = new BMap.InfoWindow(html, { width: 240, enableMessage: false });
      marker.openInfoWindow(win, meta.point);
      document.getElementById("resetBtn").style.display = "block";
      hideHint();
    });
    map.addOverlay(marker);
  }

  function initMap() {
    var el = document.getElementById("map");
    var h = window.innerHeight || 800;
    el.style.height = h + 'px';
    el.style.width = '100%';
    geocoder = new BMap.Geocoder();
    map = new BMap.Map("map");
    map.centerAndZoom(new BMap.Point(116.404, 39.915), 12);
    map.enableScrollWheelZoom(true);
    document.getElementById("error").style.display = "none";
    try { map.resize(); } catch (e) {}
    try { AndroidBridge.onMapReady(); } catch (e) {}
    // 页面就绪后主动拉取原生最新数据（覆盖 update 早于加载完成的情况）
    try {
      var raw = AndroidBridge.getData();
      if (raw) applyData(JSON.parse(raw));
    } catch (e) {
      // 桥未就绪时等待推送；其余异常必须留痕(此前 fitAll 异常被吞导致视野不生效难排查)
      console.log('applyData pull err: ' + e);
    }
  }

  // 原生侧数据更新入口：data = { my: {lat,lng,title,label}|null, targets: [{lat,lng,title,label}] }
  function applyData(data) {
    if (!map) return;
    console.log('applyData: my=' + (data && data.my ? 1 : 0) + ' targets=' + (data && data.targets ? data.targets.length : 0));
    map.clearOverlays();
    viewPoints = [];
    document.getElementById("resetBtn").style.display = "none";
    if (data && data.my) {
      var me = {
        point: new BMap.Point(data.my.lng, data.my.lat),
        title: data.my.title || "me",
        label: data.my.label || "我的位置"
      };
      viewPoints.push(me);
      addMarker(me, myIcon());
    }
    if (data && data.targets) {
      for (var i = 0; i < data.targets.length; i++) {
        var t = data.targets[i];
        var meta = {
          point: new BMap.Point(t.lng, t.lat),
          title: t.title || ("target-" + i),
          label: t.label || t.title || ("家人-" + i)
        };
        viewPoints.push(meta);
        addMarker(meta, familyIcon());
      }
    }
    // 逆地理编码：坐标 → 详细地址（如 上海市浦东新区XX路XX号），回传原生显示并缓存
    if (data && data.my) {
      addressOf(new BMap.Point(data.my.lng, data.my.lat), data.my.title || "me");
    }
    if (data && data.targets) {
      for (var j = 0; j < data.targets.length; j++) {
        var t2 = data.targets[j];
        addressOf(new BMap.Point(t2.lng, t2.lat), t2.title || ("target-" + j));
      }
    }

    if (viewPoints.length >= 2) {
      map.addOverlay(new BMap.Polyline(viewPoints.map(function (m) { return m.point; }), {
        strokeColor: "#1E88E5", strokeWeight: 4, strokeOpacity: 0.8
      }));
    }
    fitAll();
    showHint();
  }

  // 单点逆地理编码：BMap.Geocoder 将坐标转为地址（附最近周边 POI），经 AndroidBridge 回传原生并缓存
  function addressOf(point, uid) {
    if (!geocoder) return;
    geocoder.getLocation(point, function (result) {
      console.log('addr: uid=' + uid + ' result=' + (result ? (result.address ? 'HAS_ADDRESS' : 'NO_ADDRESS') : 'NULL'));
      if (result && result.address) {
        // 距离最近的周边 POI（地标比街道门牌更贴近用户感知的真实位置；返回顺序不保证按距离排，需自行比较）
        var pois = result.surroundingPois || [];
        var nearest = null, best = Infinity;
        var cosLat = Math.cos(point.lat * Math.PI / 180);
        for (var k = 0; k < pois.length; k++) {
          var pp = pois[k].point;
          if (!pp || !pois[k].title) continue;
          var dx = (pp.lng - point.lng) * cosLat, dy = pp.lat - point.lat;
          var d = dx * dx + dy * dy;
          if (d < best) { best = d; nearest = pois[k]; }
        }
        var addr = nearest ? result.address + "（近" + nearest.title + "）" : result.address;
        addrCache[uid] = addr;
        try {
          AndroidBridge.onAddress(uid, addr);
        } catch (e) { /* 原生桥未就绪时忽略 */ }
      }
    });
  }
</script>
<script>
  // 强制瓦片走 https（百度 JS API 默认跟随页面协议；避免 http 明文链路的不稳定性）
  window.BMAP_PROTOCOL = "https";
</script>
<script type="text/javascript" src="https://api.map.baidu.com/getscript?v=3.0&ak=__AK__&services=&t=20260814111607"></script>
<script>
  // 全景视角按钮：恢复两点完整视野（避开浮层的留白与打开时一致）
  document.getElementById("resetBtn").addEventListener("click", function () {
    fitAll();
    hideHint();
    this.style.display = "none";
  });
  // getscript 直接静态引入（绕过 api?v=3.0 的 document.write 引导层，避免 WebView 时序问题）。
  // 脚本加载执行后 BMap 即全局可用：轮询等待就绪后调用 initMap，超时显示错误提示。
  (function () {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (typeof BMap !== 'undefined') {
        clearInterval(timer);
        try {
          initMap();
        } catch (e) {
          document.getElementById('error').style.display = 'block';
        }
      } else if (tries > 150) {
        clearInterval(timer);
        document.getElementById('error').style.display = 'block';
      }
    }, 100);
  })();
</script>
</body>
</html>
