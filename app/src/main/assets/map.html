<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家人位置</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  /* 地图容器：absolute 铺满视口（Android WebView 下 vh 单位可能失效，JS 侧还会显式设高度） */
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #error { display: none; position: absolute; top: 42%; width: 100%; text-align: center; color: #666; font-size: 14px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="error">地图加载失败：请检查网络与 AK 配置</div>
<script>
  var map = null;

  // 标记图标：我的位置蓝色圆点，家人红色圆点（SVG data URI，无外部资源依赖）
  function myIcon() {
    // 蓝色圆点（base64 PNG，WebView 下比 data URI SVG 更可靠）

      "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAHcSURBVEhL5VU9SwNBEE1paWklaQQLf0CwSmmnlaQSG8HCImAjVrFKCiGVpLFSUAiIpBAUBC2EFEIECwOiiEiMaDSJRnMSd0besRuT2XzcWdj44BV3u/Pe7OzsbiDwb8DMQWYOt3BUzvkViChKRGfcAUR0w8wxZh6QcX2BDIkoa8ScBnH21mnysaZajfJEFJIaXcHMs0opB8EQWsi88HCiYHF6q8S5wmfTCKuRWhaQuVLkiqfP33ksWbSEJRPHVayQ9GoiUrMNpiybuZol1IvLBxVTriIzD0ldF9hQTLqrfPHI6r0l0o/YG22yK7Vd6K7guZ1nK9gLx1MPP7shOwu1x9+qo6xAP7wqNcwq2ruKmacwsH9Zt4L8MHPxYQzm2wzwAwPoHBnkh+gobZCSBhEMIAMZ5IfrpzVjEJUGIQyghjLID83BI6KJNgNtUsYgukEGeiFaG1eKxqDUh0EKI0fXjhXshWvZN5N9Xmq7wAlUitxmXtwrWwK9OLnxZDIHwlK7CbPZ1bqimXTJEupEiOP06+zjUtMCEW2bVHpdeKi5KYsWx7vh7W1g5iUiqptg3DNowZXDCidPXt1vnPoW8bhncQP56HSCvj2719wLsPn6HY7p8uGZxNUSlHP/HN99IB7WBQ3q9AAAAABJRU5ErkJggg==",
      new BMap.Size(24, 24),
      { anchor: new BMap.Size(12, 12) }
    );
  }
  function familyIcon() {
    // 红色圆点（base64 PNG）
    return new BMap.Icon(
      "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAHeSURBVEhL5VU9SwNBELW0tLRM6R8QIhYGQbASsUqpYBEQJIKgIEIEIWAhFmJALMRCbdRCG7HRxjSKhUJKbUwCniZeoknQm5F37sZkNh93FjY+eM3NzpvZ2bmZjo5/A2YOMHOohj3yzK9ARFEiuuEGIKJ7Zo4xc6f0awtkSETJqlilwuXrqyody6oNlCKioNRoCmYedxynDGcIvSwu8GNfr0FrKsKVu9tqINxGahlwM1fibyfHnBkaNIQlXzfWcUNStwlLzTroshQPDwyhVsyvxHW5MszcLXVd4EFx6DOd5vRAvyHSjngbFeRIartQXcHPc7OGsxdmx0Z+XkN2FmqPr07BNhz98OPBzRG3qO8qZh6FoXRxbjj54fvZqQ4QqQuADzCgc6STH6KjVICEDBCGARlIJz8s7u/qAFEZIAgDaiid/FD/eEQ0XBdABcnBiG6Qjl6I1sZIUeiS+giQgKWcvDScvbCws62zT0ltF/gDyXGyOJRbXjIEWvFpckJnDoSkdhX6sR3bJmtm2hBqRIjj71fZx6WmASLa06m0GniouS6LEsfe8LYbmHmeiEraGXMGLZhfW2V7a/N7JxTsWnFMO2/iGnLpNIKans1r7gV4fLWHY6p8WJMYLQF59s/xBVDC8691EJ8nAAAAAElFTkSuQmCC",
      new BMap.Size(24, 24),
      { anchor: new BMap.Size(12, 12) }
    );
  }

  var geocoder = null;

  function initMap() {
    var el = document.getElementById("map");
    var h = window.innerHeight || 800;
    el.style.height = h + 'px';
    el.style.width = '100%';
    geocoder = new BMap.Geocoder();
    map = new BMap.Map("map");
    map.centerAndZoom(new BMap.Point(116.404, 39.915), 12);
    map.enableScrollWheelZoom(true);
    document.getElementById("error").style.display = "none";
    try { map.resize(); } catch (e) {}
    try { AndroidBridge.onMapReady(); } catch (e) {}
    // 页面就绪后主动拉取原生最新数据（覆盖 update 早于加载完成的情况）
    try {
      var raw = AndroidBridge.getData();
      if (raw) applyData(JSON.parse(raw));
    } catch (e) { /* 原生桥未就绪时等待 applyData 推送 */ }
  }

  // 原生侧数据更新入口：data = { my: {lat,lng}|null, targets: [{lat,lng,title}] }
  function applyData(data) {
    if (!map) return;
    console.log('applyData: my=' + (data && data.my ? 1 : 0) + ' targets=' + (data && data.targets ? data.targets.length : 0));
    map.clearOverlays();
    var points = [];
    if (data && data.my) {
      var p = new BMap.Point(data.my.lng, data.my.lat);
      map.addOverlay(new BMap.Marker(p, { icon: myIcon() }));
      points.push(p);
    }
    if (data && data.targets) {
      for (var i = 0; i < data.targets.length; i++) {
        var t = data.targets[i];
        var p2 = new BMap.Point(t.lng, t.lat);
        map.addOverlay(new BMap.Marker(p2, { icon: familyIcon() }));
        points.push(p2);
      }
    }
    // 逆地理编码：坐标 → 详细地址（如 上海市浦东新区XX路XX号），回传原生显示
    if (data && data.my) {
      addressOf(new BMap.Point(data.my.lng, data.my.lat), "me");
    }
    if (data && data.targets) {
      for (var i = 0; i < data.targets.length; i++) {
        var t = data.targets[i];
        addressOf(new BMap.Point(t.lng, t.lat), t.title || ("target-" + i));
      }
    }

    if (points.length >= 2) {
      map.addOverlay(new BMap.Polyline(points, {
        strokeColor: "#1E88E5", strokeWeight: 4, strokeOpacity: 0.8
      }));
      map.setViewport(points);
    } else if (points.length === 1) {
      map.centerAndZoom(points[0], 15);
    }
  }

  // 单点逆地理编码：BMap.Geocoder 将坐标转为地址，经 AndroidBridge 回传原生
  function addressOf(point, uid) {
    if (!geocoder) return;
    geocoder.getLocation(point, function (result) {
      console.log('addr: uid=' + uid + ' result=' + (result ? (result.address ? 'HAS_ADDRESS' : 'NO_ADDRESS') : 'NULL'));
      if (result && result.address) {
        try {
          AndroidBridge.onAddress(uid, result.address);
        } catch (e) { /* 原生桥未就绪时忽略 */ }
      }
    });
  }
</script>
<script>
  // 强制瓦片走 https（百度 JS API 默认跟随页面协议；避免 http 明文链路的不稳定性）
  window.BMAP_PROTOCOL = "https";
</script>
<script type="text/javascript" src="https://api.map.baidu.com/getscript?v=3.0&ak=__AK__&services=&t=20260814111607"></script>
<script>
  // getscript 直接静态引入（绕过 api?v=3.0 的 document.write 引导层，避免 WebView 时序问题）。
  // 脚本加载执行后 BMap 即全局可用：轮询等待就绪后调用 initMap，超时显示错误提示。
  (function () {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (typeof BMap !== 'undefined') {
        clearInterval(timer);
        try {
          initMap();
        } catch (e) {
          document.getElementById('error').style.display = 'block';
        }
      } else if (tries > 150) {
        clearInterval(timer);
        document.getElementById('error').style.display = 'block';
      }
    }, 100);
  })();
</script>
</body>
</html>
